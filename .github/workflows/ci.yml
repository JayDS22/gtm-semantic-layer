name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Setup profiles.yml
        run: cp profiles.yml.example profiles.yml

      - name: dbt deps
        run: dbt deps --profiles-dir .

      - name: dbt seed
        run: dbt seed --profiles-dir .

      - name: dbt build
        run: dbt build --profiles-dir .

      - name: MetricFlow validate-configs
        run: mf validate-configs

      - name: Skill ⇄ metric crosswalk
        run: python scripts/skill_metric_crosswalk.py

      - name: Metric smoke queries
        run: |
          mf query --metrics arr                   --group-by metric_time__month
          mf query --metrics net_new_arr           --group-by metric_time__month
          mf query --metrics nrr                   --group-by metric_time__month,cohort_arr__cohort_month
          mf query --metrics logo_retention        --group-by metric_time__month,cohort_arr__cohort_month
          mf query --metrics win_rate              --group-by metric_time__quarter,opportunity__owner_team
          mf query --metrics pipeline_coverage     --group-by metric_time__quarter,team
          mf query --metrics pipeline_coverage_qtd --group-by metric_time__quarter,team
          mf query --metrics activation_rate       --group-by metric_time__week
          mf query --metrics cac_payback_months    --group-by metric_time__quarter
          mf query --metrics gross_margin          --group-by metric_time__quarter

      - name: SQL lint
        run: sqlfluff lint models/ --dialect duckdb
        continue-on-error: true
