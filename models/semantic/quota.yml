version: 2

semantic_models:
  - name: quota
    description: Sales quota per team per quarter, in cents.
    model: ref('fct_quota')
    defaults:
      agg_time_dimension: quarter_start
    entities:
      - name: team
        type: primary
        expr: team
    measures:
      - name: quota_arr_cents_sum
        agg: sum
        expr: quota_arr_cents
    dimensions:
      - name: quarter_start
        type: time
        type_params:
          time_granularity: quarter

metrics:
  - name: quota_arr
    description: Total quota in the period, in dollars.
    type: simple
    type_params:
      measure: { name: quota_arr_cents_sum }
    label: "Quota ARR ($)"
    config: { meta: { unit: usd, divide_by: 100 } }

  - name: pipeline_coverage
    description: Open pipeline ARR / quota ARR, by team × quarter.
    type: ratio
    type_params:
      numerator: { name: open_pipeline_arr }
      denominator: { name: quota_arr }
    label: "Pipeline coverage"
    config:
      meta:
        owner: gtm-analytics@example.com
        gotcha: "Strict open-pipeline denominator — excludes closed_won in-period. See pipeline_coverage_qtd for the inclusive alternative."

  - name: pipeline_coverage_qtd
    description: QTD coverage = (open pipeline + closed_won in-period) / quota. Inclusive sibling of pipeline_coverage (adversarial-pass mod, design doc §4).
    type: ratio
    type_params:
      numerator: { name: qtd_pipeline_arr }
      denominator: { name: quota_arr }
    label: "Pipeline coverage (QTD, inclusive)"
    config:
      meta:
        owner: gtm-analytics@example.com
        gotcha: "Trends UP as quarter progresses (strict pipeline_coverage trends DOWN). See skills/faq/pipeline-coverage-strict-vs-qtd.md."
