version: 2

semantic_models:
  - name: financials
    description: Quarterly S&M spend, revenue, COGS, net burn, and margin percentages. Powers the efficiency metrics (CAC payback, magic number, burn multiple, gross margin, rule of 40).
    model: ref('fct_financials')
    primary_entity: financials_row
    defaults:
      agg_time_dimension: quarter_start
    measures:
      - name: sm_spend_cents_sum
        agg: sum
        expr: sm_spend_cents
      - name: revenue_cents_sum
        agg: sum
        expr: revenue_cents
      - name: cogs_cents_sum
        agg: sum
        expr: cogs_cents
      - name: net_burn_cents_sum
        agg: sum
        expr: net_burn_cents
      - name: gross_margin_pct_avg
        agg: average
        expr: gross_margin_pct
      - name: operating_margin_pct_avg
        agg: average
        expr: operating_margin_pct
      - name: segment_weighted_cac_denom_cents_sum
        agg: sum
        expr: segment_weighted_cac_denom_cents
    dimensions:
      - name: quarter_start
        type: time
        type_params:
          time_granularity: quarter

metrics:
  - name: sm_spend
    type: simple
    type_params:
      measure: { name: sm_spend_cents_sum }
    label: "S&M spend ($)"
    config: { meta: { unit: usd, divide_by: 100 } }

  - name: revenue
    type: simple
    type_params:
      measure: { name: revenue_cents_sum }
    label: "Revenue ($)"
    config: { meta: { unit: usd, divide_by: 100 } }

  - name: cogs
    type: simple
    type_params:
      measure: { name: cogs_cents_sum }
    label: "COGS ($)"
    config: { meta: { unit: usd, divide_by: 100 } }

  - name: net_burn
    type: simple
    type_params:
      measure: { name: net_burn_cents_sum }
    label: "Net burn ($)"
    config: { meta: { unit: usd, divide_by: 100 } }

  - name: gross_margin_pct_metric
    type: simple
    type_params:
      measure: { name: gross_margin_pct_avg }
    label: "Gross margin pct (seed-provided)"

  - name: operating_margin_pct_metric
    type: simple
    type_params:
      measure: { name: operating_margin_pct_avg }
    label: "Operating margin pct"

  - name: segment_weighted_cac_denom
    description: "Segment-weighted CAC denominator = sum(new_arr_s * gm_s * mix_s across SMB/MM/ENT). Computed in fct_financials via join to segment_margins seed."
    type: simple
    type_params:
      measure: { name: segment_weighted_cac_denom_cents_sum }
    label: "Segment-weighted CAC denominator"
    config: { meta: { unit: usd, divide_by: 100 } }

  - name: gross_profit
    description: Revenue minus COGS.
    type: derived
    type_params:
      expr: revenue - cogs
      metrics:
        - { name: revenue }
        - { name: cogs }
    label: "Gross profit ($)"
    config: { meta: { unit: usd, divide_by: 100 } }

  - name: gross_margin
    description: "(revenue - cogs) / revenue. The computed ratio."
    type: ratio
    type_params:
      numerator: { name: gross_profit }
      denominator: { name: revenue }
    label: "Gross margin"

  - name: magic_number
    description: "Simplified SaaS magic number: net_new_arr * 4 / sm_spend. Textbook is (ARR_Q - ARR_{Q-1}) * 4 / S&M_{Q-1} (lag the S&M); we use same-period S&M for simplicity."
    type: derived
    type_params:
      expr: net_new_arr * 4.0 / nullif(sm_spend, 0)
      metrics:
        - { name: net_new_arr }
        - { name: sm_spend }
    label: "Magic number"

  - name: burn_multiple
    description: "net_burn / net_new_arr. Lower is better; >2 is a warning threshold."
    type: derived
    type_params:
      expr: 1.0 * net_burn / nullif(net_new_arr, 0)
      metrics:
        - { name: net_burn }
        - { name: net_new_arr }
    label: "Burn multiple"

  - name: cac_payback_months
    description: "Day 5 segment-weighted CAC payback per design doc 2.3 metric 16. Formula: 12 * sm_spend / sum(new_arr_s * gm_s * mix_s across segments), where segment_weighted_cac_denom is pre-aggregated in fct_financials from the segment_margins seed. Still evolving (not stable): the segment-level new_arr/GM/mix are seeded placeholders; Day 6+ derives new_arr by segment from fct_mrr_movement joined to dim_account.segment."
    type: derived
    type_params:
      expr: 12.0 * sm_spend / nullif(segment_weighted_cac_denom, 0)
      metrics:
        - { name: sm_spend }
        - { name: segment_weighted_cac_denom }
    label: "CAC payback (months, segment-weighted)"

  - name: rule_of_40
    description: "Bessemer's growth + profitability shorthand: (ARR growth %) + (operating margin %). Should sum to >= 40 for a healthy SaaS. Growth term uses QoQ-annualized ARR growth from fct_arr_qoq_growth; see skills/metrics/rule-of-40.md for the YoY-vs-QoQ convention tradeoff."
    type: derived
    type_params:
      expr: (arr_qoq_annualized_growth_pct + operating_margin_pct_metric) * 100.0
      metrics:
        - { name: arr_qoq_annualized_growth_pct }
        - { name: operating_margin_pct_metric }
    label: "Rule of 40 (growth + margin)"
