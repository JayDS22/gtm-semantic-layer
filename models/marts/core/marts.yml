version: 2

models:
  - name: dim_account
    description: One row per current account. Day 2 ships as straight dim (is_current = true for all); Day 4 flips to SCD2 via dbt snapshot per design doc §2.1.
    columns:
      - name: account_sk
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null, unique]
      - name: account_name
        meta: { pii: customer_identifier }
      - name: segment
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [SMB, MM, ENT]
      - name: region
        tests: [not_null]

  - name: dim_user
    description: User dim with PII dropped at the mart boundary (see dim_user.sql).
    columns:
      - name: user_sk
        tests: [not_null, unique]
      - name: user_id
        tests: [not_null, unique]
      - name: team
        tests: [not_null]

  - name: dim_plan
    columns:
      - name: plan_sk
        tests: [not_null, unique]
      - name: plan_id
        tests: [not_null, unique]
      - name: tier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [SMB, MM, ENT]

  - name: dim_date
    description: Day spine 2025-01-01 through 2028-01-01 (exclusive). Declared as the MetricFlow time spine for the project.
    time_spine:
      standard_granularity_column: calendar_date
    columns:
      - name: calendar_date
        granularity: day
        tests: [not_null, unique]

  - name: dim_customer
    description: Stripe customer dim mapped to SFDC account. Orphan customers have null account_sk; int_account_hierarchy_reconciliation surfaces them.
    columns:
      - name: customer_sk
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null, unique]

  - name: fct_opportunity
    description: One row per opportunity (current state).
    columns:
      - name: opportunity_sk
        tests: [not_null, unique]
      - name: opportunity_id
        tests: [not_null, unique]
      - name: account_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_sk
      - name: stage
        tests: [not_null]
      - name: arr_cents
        tests: [not_null]

  - name: fct_mrr_movement
    description: One row per account × month × movement_type. Single canonical source for ARR waterfalls.
    tests:
      - assert_grain:
          arguments:
            columns: [account_sk, month_date, movement_type]
    columns:
      - name: account_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_sk
      - name: month_date
        tests: [not_null]
      - name: movement_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [new, expansion, contraction, churn, reactivation]
      - name: arr_delta_cents
        tests: [not_null]

  - name: fct_quota
    description: Sales quota by team × quarter.
    columns:
      - name: quota_sk
        tests: [not_null, unique]
      - name: team
        tests: [not_null]
      - name: quarter_start
        tests: [not_null]
      - name: quota_arr_cents
        tests: [not_null]

  - name: fct_funnel_event
    description: Classified product funnel events, one row per event.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: funnel_stage
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [visit, signup, mql, sql, activation, expansion]
      - name: event_at
        tests: [not_null]

  - name: fct_financials
    description: Quarterly S&M spend, revenue, COGS, net burn, margins.
    columns:
      - name: financials_sk
        tests: [not_null, unique]
      - name: quarter_start
        tests: [not_null, unique]
      - name: sm_spend_cents
        tests: [not_null]
      - name: revenue_cents
        tests: [not_null]

  - name: fct_cohort_arr_monthly
    description: Cohort-static ARR aggregation. One row per (cohort_month × reporting_month).
    tests:
      - assert_grain:
          arguments:
            columns: [cohort_month, reporting_month]
    columns:
      - name: cohort_month
        tests: [not_null]
      - name: reporting_month
        tests: [not_null]
      - name: cohort_t0_arr_cents
        tests: [not_null]
      - name: cohort_logo_t0
        tests: [not_null]
